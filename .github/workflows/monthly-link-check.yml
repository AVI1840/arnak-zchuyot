name: Monthly Link & Content Check

on:
  schedule:
    # Runs at 09:00 Israel time (06:00 UTC) on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract and check external links
        id: check
        run: |
          echo "## בדיקת קישורים חיצוניים — $(date +'%d/%m/%Y')" > report.md
          echo "" >> report.md

          # Extract all action_link URLs from rightsDatabase.ts
          LINKS=$(grep -oP "action_link: '\\K[^']+" src/data/rightsDatabase.ts | sort -u)

          # Add the link from RightDetailModal
          MODAL_LINKS=$(grep -oP 'href="\\K(https://[^"]+)' src/components/RightDetailModal.tsx | sort -u)

          ALL_LINKS=$(echo -e "$LINKS\n$MODAL_LINKS" | sort -u | grep -v '^$')

          BROKEN=""
          WORKING=""

          echo "$ALL_LINKS" | while IFS= read -r url; do
            if [ -z "$url" ]; then continue; fi
            
            # Check URL with curl (follow redirects, timeout 15s)
            HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" -L --max-time 15 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              "$url" 2>/dev/null || echo "000")
            
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "✅ [$HTTP_CODE] $url" >> report.md
            elif [ "$HTTP_CODE" = "403" ]; then
              # gov.il often returns 403 to bots but page exists
              echo "⚠️ [$HTTP_CODE] $url (חסום לבוטים — לבדוק ידנית)" >> report.md
            else
              echo "❌ [$HTTP_CODE] $url" >> report.md
              echo "$url" >> broken_links.txt
            fi
          done

          # Check if site itself is accessible
          echo "" >> report.md
          echo "## בדיקת האתר עצמו" >> report.md
          SITE_CODE=$(curl -o /dev/null -s -w "%{http_code}" -L --max-time 15 \
            "https://avi1840.github.io/arnak-zchuyot/" 2>/dev/null || echo "000")
          
          if [ "$SITE_CODE" -ge 200 ] && [ "$SITE_CODE" -lt 400 ]; then
            echo "✅ האתר נגיש (HTTP $SITE_CODE)" >> report.md
          else
            echo "❌ האתר לא נגיש! (HTTP $SITE_CODE)" >> report.md
            echo "SITE_DOWN" >> broken_links.txt
          fi

          # Check rights count hasn't changed unexpectedly
          echo "" >> report.md
          echo "## סטטיסטיקות מאגר" >> report.md
          RIGHTS_COUNT=$(grep -c "id: '" src/data/rightsDatabase.ts || echo "0")
          echo "- מספר זכויות במאגר: $RIGHTS_COUNT" >> report.md
          
          LINKS_COUNT=$(echo "$ALL_LINKS" | wc -l)
          echo "- מספר קישורים חיצוניים: $LINKS_COUNT" >> report.md

          # Set output
          if [ -f broken_links.txt ]; then
            echo "has_broken=true" >> $GITHUB_OUTPUT
          else
            echo "has_broken=false" >> $GITHUB_OUTPUT
          fi

          cat report.md

      - name: Create issue if broken links found
        if: steps.check.outputs.has_broken == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            const broken = fs.existsSync('broken_links.txt') 
              ? fs.readFileSync('broken_links.txt', 'utf8') 
              : '';
            
            const title = `🔗 בדיקה חודשית: נמצאו קישורים שבורים — ${new Date().toLocaleDateString('he-IL')}`;
            const body = `# בדיקה חודשית אוטומטית\n\n${report}\n\n---\n⚠️ יש לבדוק ולתקן את הקישורים השבורים.\nאם הקישור הוסר מאתר gov.il, יש למצוא את הכתובת החדשה ולעדכן ב-\`src/data/rightsDatabase.ts\`.`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'maintenance']
            });

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: monthly-link-report
          path: report.md
          retention-days: 90
