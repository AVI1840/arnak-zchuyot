name: Update Rights Data from Excel

on:
  push:
    paths:
      - 'data/rights_master.xlsx'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.3.0)'
        required: false
        default: ''

jobs:
  convert-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install xlsx parser
        run: npm install xlsx --no-save

      - name: Convert Excel to JSON
        run: node scripts/excel-to-json.cjs

      - name: Generate TypeScript database
        run: node scripts/generate-rights-db.cjs

      - name: Build and validate
        run: npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "data: עדכון מאגר זכויות מקובץ Excel"
          body: |
            ## עדכון אוטומטי מ-rights_master.xlsx

            הקובץ `data/rights_master.xlsx` עודכן.
            ה-JSON וקוד ה-TypeScript עודכנו אוטומטית.

            **בדקו:**
            - [ ] מספר הזכויות תקין
            - [ ] Build עובר
            - [ ] אין שגיאות validation

            ---
            Generated by GitHub Actions
          branch: data-update-${{ github.run_number }}
          commit-message: "data: auto-update rights from Excel"
